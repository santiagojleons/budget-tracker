<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Login Test</title>
<style>
body{font-family:Arial;background:#0a0d14;color:#e8edf5;display:flex;align-items:center;justify-content:center;min-height:100vh;}
.card{background:#141929;border:1px solid #1f2d45;border-radius:16px;padding:32px;width:340px;display:flex;flex-direction:column;gap:12px;}
input{background:#0f1320;border:1px solid #1f2d45;border-radius:8px;color:#e8edf5;padding:10px 12px;font-size:14px;width:100%;box-sizing:border-box;}
button{background:#22c77a;color:#000;border:none;border-radius:8px;padding:12px;font-size:14px;font-weight:700;cursor:pointer;width:100%;}
#msg{font-size:12px;text-align:center;min-height:16px;color:#f87171;}
</style>
</head>
<body>
<div class="card">
  <h2 style="margin:0;color:#22c77a;">Budget Tracker</h2>
  <p style="margin:0;color:#6b7a99;font-size:13px;">Sign in to your account</p>
  <input id="email" type="email" placeholder="Email"/>
  <input id="pass" type="password" placeholder="Password" onkeydown="if(event.key==='Enter')login()"/>
  <button onclick="login()">Log In</button>
  <button onclick="signup()" style="background:transparent;border:1px solid #263350;color:#e8edf5;">Create Account</button>
  <p id="msg"></p>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const { createClient } = supabase;
const sb = createClient(
  'https://mmlwddyksjsxzsuohhwc.supabase.co',
  'sb_publishable_jf1ycwxyiHLHDyNGi6OTMQ_aNHZAw6L'
);

async function login(){
  var msg = document.getElementById('msg');
  msg.style.color='#6b7a99'; msg.textContent='Signing in...';
  var {error} = await sb.auth.signInWithPassword({
    email: document.getElementById('email').value,
    password: document.getElementById('pass').value
  });
  if(error){ msg.style.color='#f87171'; msg.textContent=error.message; }
  else { msg.style.color='#22c77a'; msg.textContent='Success! Redirecting...'; }
}

async function signup(){
  var msg = document.getElementById('msg');
  msg.style.color='#6b7a99'; msg.textContent='Creating account...';
  var {error} = await sb.auth.signUp({
    email: document.getElementById('email').value,
    password: document.getElementById('pass').value
  });
  if(error){ msg.style.color='#f87171'; msg.textContent=error.message; }
  else { msg.style.color='#22c77a'; msg.textContent='Check your email to confirm!'; }
}
</script>
</body>
</html>
